
# Quarto CV Configuration - GitHub Pages Optimized
# IMPORTANT: This configuration is specifically designed for GitHub Pages deployment
# DO NOT CHANGE output-dir from "." without understanding GitHub Pages implications

project:
  type: website                # Website type required for GitHub Pages integration
  output-dir: .               # Output to root directory - CRITICAL for GitHub Pages
  resources:                  # Include PDF files as resources for download links
    - "*.pdf"

website:
  title: "Leslie Hodges Gallagher CV"
  navbar:
    left:
      - href: index.html
        text: Home

format:
  html:
    theme: none              # Custom styling via CSS
    css: styles.css
    toc: false              # No table of contents for CV format
  pdf:
    author: "Leslie Hodges Gallagher, Ph.D."
    pdf-engine: weasyprint  # Reliable PDF generation
    css: styles.css         # Apply same styles to PDF

format-links: [pdf]         # Enable PDF download button in HTML version
